# Model
model: dpo
model_conf:
    beta: 0.1

transformer: huggingface
transformer_conf:
    hf_model_tag: HuggingFaceTB/SmolLM2-1.7B-Instruct
    activation_checkpointing: true
    
corelm: ar_delay
corelm_conf:
    share_emb: false

# loss
modality_weights: {
    "g2p": 1.0,
    "ssl": 0.5,
    "codec": 0.0625,
    "text_bpe": 1.0,
    "image": 1.0,
    "special_token": 10.0,
}
loss_region: target

# General Dataloader configuration
batch_type: numel
batch_bins: 16000
max_epoch: 3
num_workers: 6
drop_last_iter: true
log_interval: 10

# Data preprocessing
codec_token_per_frame: 9
codec_token_in_use: 9
speaker_prompt_length: 500

# specaug
asr_apply_time_mask: true
asr_time_mask_config:
    mask_width_ratio_range:
    - 0.
    - 0.05
    num_mask: 10

# deepspeed
use_deepspeed: true
deepspeed_config: conf/deepspeed_ddp_zero2_olmo_dpo.json
deepspeed_step_sync: false

# Pre-Trained Model
init_param: [
    "exp/speechlm_audio_dialogue_fisher_train_s2s_lr1e-5_fisher_complete_copy/14epoch_speechlm3.pth",
]

seed: 999
